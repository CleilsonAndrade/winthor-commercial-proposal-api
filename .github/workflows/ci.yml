name: CI - Commercial Proposal API

on:
  push:
    branches:
      - dev
      - staging
      - master

  pull_request:
    branches:
      - dev
      - staging
      - master

permissions:
  contents: read

jobs:
  test-and-build:
    name: Validate and Build API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run lint without fixes
        run: |
          ./node_modules/.bin/eslint \
            'src/**/*.ts' \
            'test/**/*.ts'

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build application
        run: npm run build

      - name: Validate production build
        run: |
          test -f dist/main.js
          node --check dist/main.js

          node --check ecosystem.config.js

      - name: Prepare deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deployment-artifact

          cp -a dist deployment-artifact/
          cp package.json deployment-artifact/
          cp package-lock.json deployment-artifact/
          cp ecosystem.config.js deployment-artifact/

          test -f deployment-artifact/dist/main.js
          test -f deployment-artifact/package.json
          test -f deployment-artifact/package-lock.json
          test -f deployment-artifact/ecosystem.config.js

          node --check deployment-artifact/dist/main.js
          node --check deployment-artifact/ecosystem.config.js

      - name: Upload approved deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: winthor-commercial-proposal-api-production
          path: deployment-artifact/
          if-no-files-found: error
          retention-days: 3
